<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theseus Control Plane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<!-- Start slide for the live demo: shown during the opening words. Setu.Hackathon, 07.11.2026.
     Same composition as the video's opening: logo v8 left, banner line right. Press F (or double-click) for full screen. -->
<style>
  :root {
    --ink: #0b3a5e; --glacier: #3fa6e8; --ice: #dde9f2; --amber-deep: #c98a12; --snow: #f6f9fc; --muted: #5a7389;
    --sans: "Geist", -apple-system, "Segoe UI", sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
    --mono: "Geist Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 30% 40%, #ffffff 0%, var(--snow) 55%, #eaf2f8 100%);
    color: var(--ink); font-family: var(--sans);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .stage { width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; position: relative; }
  .logo { position: absolute; left: 6%; top: 15%; width: 36%; aspect-ratio: 1; object-fit: contain;
          animation: rise 1.4s ease-out both, float 6s ease-in-out 1.4s infinite; }
  .text { position: absolute; left: 46%; top: 28%; width: 48%; animation: fade 1.2s ease-out .3s both; }
  .headline { font-family: var(--serif); font-size: calc(min(100vw, 177.78vh) * 0.046); line-height: 1.04; color: var(--ink); }
  .headline em { font-style: italic; color: var(--amber-deep); }
  .name { margin-top: 2.2%; font-family: var(--mono); font-size: calc(min(100vw, 177.78vh) * 0.0155);
          letter-spacing: .22em; text-transform: uppercase; color: var(--glacier); }
  .foot { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; font-family: var(--mono);
          font-size: calc(min(100vw, 177.78vh) * 0.011); letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
          animation: fade 1.2s ease-out .8s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.2%); } }
  @media (prefers-reduced-motion: reduce) { .logo, .text, .foot { animation: none; } }
</style>
</head>
<body>
  <div class="stage">
    <img class="logo" src="../../../styles/theseus-logo-v8-spacesuit.png" alt="Theseus: a half-rebuilt ship with a human at the helm">
    <div class="text">
      <div class="headline">Let AI employees improve your company. <em>Keep your goals, rules, and culture.</em></div>
      <div class="name">Theseus Control Plane</div>
    </div>
    <div class="foot">AIE Code Summit Hackathon · San Francisco · November 7, 2026</div>
  </div>
  <script>
    const fs = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
    document.addEventListener("keydown", e => { if (e.key === "f" || e.key === "F") fs(); });
    document.addEventListener("dblclick", fs);
  </script>
</body>
</html>
